name: backup-secrets
on:
  workflow_dispatch:
    inputs:
      recipient:
        required: true
permissions: {}
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          S_ADMIN_BOOTSTRAP_TELEGRAM_IDS: ${{ secrets.ADMIN_BOOTSTRAP_TELEGRAM_IDS }}
          S_ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          S_RESOLVER_API_INTERNAL_TOKEN: ${{ secrets.RESOLVER_API_INTERNAL_TOKEN }}
          S_TELEGRAM_BOT_TOKENS: ${{ secrets.TELEGRAM_BOT_TOKENS }}
          S_TELEGRAM_PUBLIC_BOT_USERNAME: ${{ secrets.TELEGRAM_PUBLIC_BOT_USERNAME }}
          S_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          S_WORKER_RELAY_SECRET: ${{ secrets.WORKER_RELAY_SECRET }}
        run: |
          set -euo pipefail
          curl -sL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz | tar xz && sudo mv age/age /usr/local/bin/
          python3 - <<'PY' > secrets.repo.json
          import os,json
          print(json.dumps({k[2:]:v for k,v in os.environ.items() if k.startswith("S_")}))
          PY
          age -r "${{ inputs.recipient }}" secrets.repo.json > secrets.repo.json.age
          rm secrets.repo.json
          python3 - secrets.repo.json.age <<'PY'
          import base64, pathlib, sys
          encoded = base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode()
          print("----BEGIN GHBACKUP repo----")
          for offset in range(0, len(encoded), 2000):
              print(encoded[offset:offset + 2000])
          print("----END GHBACKUP repo----")
          PY
          rm secrets.repo.json.age
